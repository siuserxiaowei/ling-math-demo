<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数学，看得见</title>
<style>
:root{--paper:#fff9ed;--ink:#173e3c;--teal:#168b89;--orange:#f39764;--muted:#627770;--line:#d7dfcf}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}button,input,select{font:inherit}main{max-width:1120px;margin:auto;padding:38px 26px 28px}.eyebrow{font-size:13px;letter-spacing:.14em;color:var(--teal);font-weight:700}h1{font-size:clamp(28px,4vw,46px);letter-spacing:-.045em;text-wrap:balance;line-height:1.25;margin:15px 0 12px}.intro{color:var(--muted);font-size:16px;line-height:1.7;margin:0 0 20px}.visual{position:relative;border-block:1px solid var(--line)}svg{width:100%;display:block;overflow:visible}.caption{min-height:80px;font-size:21px;font-weight:600;line-height:1.7;max-width:850px;margin:20px auto;color:var(--ink)}.controls{display:grid;gap:16px;max-width:850px;margin:25px auto 0}button{border:1px solid var(--ink);border-radius:30px;background:transparent;color:var(--ink);padding:10px 22px;cursor:pointer}button.primary{background:var(--ink);color:var(--paper)}button:hover{background:var(--teal);color:var(--paper)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--orange);outline-offset:4px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.row label{display:flex;gap:10px;align-items:center;font-size:15px}select,input[type=number]{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px;color:var(--ink)}input[type=range]{width:100%;accent-color:var(--teal);cursor:pointer}output{font-variant-numeric:tabular-nums}.foot{font-size:12px;line-height:1.8;color:var(--muted);margin-top:30px;border-top:1px solid var(--line);padding-top:14px}.screen-formula{font-size:clamp(24px,4vw,40px);text-align:center;padding:0 0 14px;min-height:58px;font-family:Georgia,"Songti SC",serif}.video-view{display:none}.fraction-controls{display:none}body.fraction .circle-controls{display:none}body.fraction .fraction-controls{display:flex}body.video main{display:none}body.video .video-view{display:block;width:100vw;height:100vh;overflow:hidden}body.video .video-view svg{width:100%;height:100%;overflow:hidden}svg text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:var(--ink)}@media(max-width:520px){main{padding:26px 18px}.intro{font-size:14px}.caption{font-size:17px;min-height:88px}button{padding:9px 17px}.row{gap:9px}.foot{font-size:11px}body:not(.video) svg text{font-size:42px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
<main>
  <div class="eyebrow">数学，看得见 / 可操作的原理讲解</div>
  <h1 id="heading"></h1><p class="intro" id="intro"></p>
  <div class="visual"><svg id="diagram" viewBox="0 0 1080 620" role="img" aria-labelledby="diagramTitle"><title id="diagramTitle">数学推导演示</title><g id="diagramContent"></g></svg></div>
  <p class="caption" id="caption" aria-live="off"></p><div class="screen-formula" id="formula"></div>
  <div class="controls">
    <label for="progress">讲解进度 <output id="timeLabel"></output></label><input id="progress" type="range" min="0" step="0.05" value="0" aria-label="讲解进度">
    <div class="row"><button id="play" class="primary">开始讲解</button><button id="reset">重新开始</button><label class="circle-controls">扇形数量<select id="parts" aria-label="扇形数量"><option value="auto">跟随讲解</option><option>8</option><option>16</option><option>32</option><option>64</option></select></label></div>
    <div class="row fraction-controls"><label>算例<select id="fractionExample" aria-label="分数除法算例"><option value="3,4,1,2">3/4 ÷ 1/2</option><option value="2,3,1,6">2/3 ÷ 1/6</option><option value="4,7,3,1">4/7 ÷ 3</option></select></label></div>
  </div>
  <p class="foot">本页可离线使用。图形按实际几何关系绘制；播放画面与视频导出使用同一个时间函数。<br><span id="credit"></span></p>
</main>
<div class="video-view"><svg id="videoSvg" viewBox="0 0 1080 1920" role="img" aria-label="竖版数学讲解视频画面"></svg></div>
<script id="lessonConfig" type="application/json">__LESSON_CONFIG__</script>
<script>
(()=>{'use strict';
const cfg=JSON.parse(document.getElementById('lessonConfig').textContent),isFraction=cfg.topic==='fraction-division';
const video=new URLSearchParams(location.search).get('video')==='1';
document.body.classList.toggle('video',video);document.body.classList.toggle('fraction',isFraction);
const NS='http://www.w3.org/2000/svg',C={ink:'#173e3c',teal:'#168b89',orange:'#f39764',paper:'#fff9ed',line:'#d7dfcf',muted:'#627770'};
const $=id=>document.getElementById(id),duration=Number(cfg.duration)||54;
const state={time:0,playing:false,manualN:null,fraction:[3,4,1,2],lastStamp:0,geometry:null};
const title=isFraction?'除以一个分数，到底在分什么？':'圆的面积，为什么是 πr²？';
$('heading').textContent=title;$('intro').textContent=isFraction?'看看一段长度里，装得下多少个“除数那么大”的单位。':'切开、换个位置，再看看：弯边怎样越来越接近直边。';
$('credit').textContent=cfg.provenance||'原创教学基准样例；未标注为任何指定模型的实测输出。';
document.title=title;$('progress').max=duration;
function el(name,attrs={},text){const n=document.createElementNS(NS,name);for(const[k,v]of Object.entries(attrs))n.setAttribute(k,String(v));if(text!==undefined)n.textContent=text;return n;}
function text(g,x,y,s,size=30,attrs={}){const n=el('text',{x,y,'font-size':size,...attrs},s);g.append(n);return n;}
function ease(t){t=Math.max(0,Math.min(1,t));return t*t*(3-2*t);}
function wrap(s,max){const result=[];let rest=s;while(rest.length>max){let cut=max;for(let i=max-1;i>=Math.floor(max*.6);i--){if(/[，。；！？、：]/.test(rest[i])){cut=i+1;break;}}result.push(rest.slice(0,cut));rest=rest.slice(cut).trimStart();}if(rest)result.push(rest);return result;}
function stageAt(t){if(isFraction)return Math.min(3,Math.floor(t/(duration/4)));const segments=cfg.segments;return segments?Math.min(5,Math.max(0,segments.findLastIndex(s=>t>=s.start))):t<6.6?0:t<13.65?1:t<22.94?2:t<31.16?3:t<41.84?4:5;}
function circleData(t){const stage=stageAt(t);let n=8;if(stage>=3){const start=cfg.segments?.[3]?.start??22.94,end=cfg.segments?.[3]?.end??30.91;const q=(t-start)/Math.max(.1,end-start);n=q<.25?16:q<.58?32:64;}if(stage>=4)n=64;if(state.manualN)n=state.manualN;const r=244,a=Math.PI/n,s=r*Math.sin(a),c=r*Math.cos(a);const rearrangeStart=cfg.segments?.[2]?.start??13.65;const p=ease((t-rearrangeStart)/5.6);const left=-s,right=n*s,dx=540-(left+right)/2;const cy=324;const baseline=cy+c/2;const sectors=[];for(let i=0;i<n;i++){const k=Math.floor(i/2),targetX=dx+(2*k+i%2)*s,targetY=baseline-(i%2?c:0),startDeg=i*360/n,targetDeg=i%2?180:0;let delta=((targetDeg-startDeg+540)%360)-180;const rotation=startDeg+p*delta,x=540+(targetX-540)*p,y=cy+(targetY-cy)*p;const rad=rotation*Math.PI/180;sectors.push({id:i,angle:2*Math.PI/n,radius:r,x,y,rotation,transform:[Math.cos(rad),Math.sin(rad),-Math.sin(rad),Math.cos(rad),x,y]});}return{time:t,n,radius:r,stage,rearrange:p,sectors,arcHalfLength:Math.PI*r,projectedChordLength:n*s,chordSeparation:c,sagitta:r-c,area:Math.PI*r*r};}
function circle(g,t){const d=circleData(t),{n,radius:r,sectors,stage,rearrange:p}=d;const a=Math.PI/n,s=r*Math.sin(a),c=r*Math.cos(a);const path=`M0 0 L${-s} ${-c} A${r} ${r} 0 0 1 ${s} ${-c} Z`;const splitOpacity=stage===0?Math.max(0,(t-3)/3):1;
for(const q of sectors)g.append(el('path',{d:path,fill:q.id%2?C.orange:C.teal,stroke:C.paper,'stroke-width':stage===0?splitOpacity*1.8:1.8,transform:`matrix(${q.transform.join(' ')})`,'data-sector':q.id}));
if(p<.2){g.append(el('path',{d:`M540 324L540 ${324-r}`,stroke:C.ink,'stroke-width':3,opacity:1-p*5}));text(g,558,220,'r',40,{opacity:1-p*5,'font-style':'italic'});}
if(p>.98){text(g,540,110,stage>=4?'长越来越接近 πr':'这些弯边，还没有变成直线',30,{'text-anchor':'middle',fill:C.muted});const y=324+c/2+64;g.append(el('path',{d:`M${540-n*s/2} ${y}h${n*s}`,stroke:C.ink,'stroke-width':2,'stroke-dasharray':'5 6'}));text(g,540,y+42,stage>=4?'水平长度越来越接近 πr':'有限切分：近似长方形',27,{'text-anchor':'middle'});if(stage>=4)text(g,980,335,'宽 → r',29,{'text-anchor':'middle'});}
text(g,38,54,`切分 ${n} 份`,26,{fill:C.muted});text(g,1042,54,'面积始终不变',26,{'text-anchor':'end',fill:C.muted});
state.geometry=d;return d;}
const gcd=(a,b)=>b?gcd(b,a%b):a;function frac(a,b){const g=gcd(a,b);a/=g;b/=g;return b===1?String(a):`${a}/${b}`;}
function fraction(g,t){const [a,b,c,d]=state.fraction,amount=a/b,unit=c/d,q=amount/unit,stage=stageAt(t),scale=800/Math.max(1,amount,unit),x=140,y=210,h=110;const result=frac(a*d,b*c);g.append(el('rect',{x,y,width:Math.max(1,amount,unit)*scale,height:h,fill:'#e6ecdf',rx:8}));g.append(el('rect',{x,y,width:amount*scale,height:h,fill:C.teal,rx:8}));text(g,x,y-35,`已有长度：${frac(a,b)}`,36);if(stage>=1){g.append(el('rect',{x,y:y+170,width:unit*scale,height:h,fill:C.orange,rx:8}));text(g,x,y+150,`每一组：${frac(c,d)}`,32);}if(stage>=2){const count=Math.ceil(q);for(let k=0;k<count;k++){const part=Math.min(unit,Math.max(0,amount-k*unit));g.append(el('rect',{x:x+k*unit*scale,y,width:part*scale,height:h,fill:'none',stroke:C.paper,'stroke-width':5,'data-group':k}));}text(g,540,525,`能装下 ${result} 组`,42,{'text-anchor':'middle'});}const geom={time:t,stage,n:null,radius:null,sectors:[],dividend:[a,b],divisor:[c,d],quotient:[a*d/gcd(a*d,b*c),b*c/gcd(a*d,b*c)],amountPixels:amount*scale,groupPixels:unit*scale,groups:q};state.geometry=geom;return geom;}
function caption(t){if(!isFraction&&state.manualN&&stageAt(t)===1)return `当前把圆平均切成 ${state.manualN} 个全等扇形。每块一样大，合起来仍是原来的圆。`;if(!isFraction&&state.manualN&&stageAt(t)===3)return `当前手动选择 ${state.manualN} 份。切换到更多份数，比较弯边怎样越来越接近直线。`;if(cfg.segments){const seg=cfg.segments.find(s=>t>=s.start&&t<=s.end)||cfg.segments[Math.max(0,cfg.segments.findLastIndex(s=>t>=s.start))];return seg.text.replaceAll('派乘半径的平方','π 乘半径的平方').replaceAll('派乘半径','π 乘半径');}if(isFraction){const [a,b,c,d]=state.fraction;return['除法可以问：已有的长度里，能装下几个指定大小的单位？',`现在有 ${frac(a,b)}，每一组是 ${frac(c,d)}。先比较它们的长度。`,'一个完整单位算一组；剩下的部分，要看它占一组的几分之几。','图形和算式说的是同一件事：除以一个数，等于乘它的倒数。'][stageAt(t)];}return['圆的面积为什么是 π 乘半径的平方？先别背公式，看这个圆。','把圆平均切成八份。每一块一样大，合起来还是原来的圆。','只移动、旋转这些扇形。形状和大小没变，总面积也没变。','继续细分。扇形越多，弯边越接近直线。','越来越接近长方形：长趋近半个圆周 πr，宽趋近半径 r。','圆的面积 = πr × r = πr²。切开重排，面积始终不变。'][stageAt(t)];}
function formula(t){if(isFraction){const[a,b,c,d]=state.fraction;return stageAt(t)>=3?`${frac(a,b)} ÷ ${frac(c,d)} = ${frac(a,b)} × ${frac(d,c)} = ${frac(a*d,b*c)}`:'';}return stageAt(t)>=5?'S = πr × r = πr²':stageAt(t)>=2?'切开重排，面积始终不变':'';}
function render(t){state.time=Math.min(duration,Math.max(0,Number(t)||0));t=state.time;const g=$('diagramContent');g.replaceChildren();(isFraction?fraction:circle)(g,t);const cap=caption(t),fm=formula(t);$('caption').textContent=cap;$('formula').textContent=fm;$('progress').value=t;$('timeLabel').textContent=`${t.toFixed(1)} / ${duration.toFixed(1)} 秒`;
if(video){const v=$('videoSvg');v.replaceChildren();v.append(el('rect',{width:1080,height:1920,fill:C.paper}));text(v,84,115,'数学，看得见',28,{fill:C.teal,'letter-spacing':3});const lines=wrap(title,16);lines.forEach((line,i)=>text(v,84,214+i*74,line,62,{'font-weight':700}));text(v,84,385,isFraction?'用长度，看懂分组':'把圆切开，再拼明白',29,{fill:C.muted});const vg=el('g',{transform:'translate(0 460)'});(isFraction?fraction:circle)(vg,t);v.append(vg);v.append(el('path',{d:'M84 1160H996',stroke:C.line,'stroke-width':2}));const caps=wrap(cap,20);caps.forEach((line,i)=>text(v,84,1250+i*62,line,39,{'font-weight':500}));if(fm)text(v,540,1580,fm,isFraction?39:58,{'text-anchor':'middle','font-family':'Georgia,serif','font-weight':700});text(v,84,1770,isFraction?'先看分组，再理解算式':'每块大小没变 · 总面积不变',28,{fill:C.muted});if(!isFraction&&stageAt(t)>=2)text(v,84,1820,'有限切分是近似，继续细分才越来越接近。',26,{fill:C.muted});v.append(el('rect',{x:84,y:1862,width:912,height:5,fill:C.line}));v.append(el('rect',{x:84,y:1862,width:912*t/duration,height:5,fill:C.teal}));}}
function tick(stamp){if(!state.playing)return;if(state.lastStamp)render(state.time+(stamp-state.lastStamp)/1000);state.lastStamp=stamp;if(state.time>=duration){state.playing=false;$('play').textContent='再看一次';return;}requestAnimationFrame(tick);}
$('play').onclick=()=>{state.playing=!state.playing;state.lastStamp=0;if(state.playing){if(state.time>=duration)render(0);requestAnimationFrame(tick);}$('play').textContent=state.playing?'暂停讲解':'继续讲解';};
$('reset').onclick=()=>{state.playing=false;state.manualN=null;$('parts').value='auto';$('play').textContent='开始讲解';render(0);};
$('progress').oninput=e=>{state.playing=false;$('play').textContent='继续讲解';render(Number(e.target.value));};
$('parts').onchange=e=>{state.manualN=e.target.value==='auto'?null:Number(e.target.value);render(state.time);};
$('fractionExample').onchange=e=>{state.fraction=e.target.value.split(',').map(Number);render(state.time);};
window.lesson={duration,setTime(seconds){state.playing=false;render(seconds);},inspect(){return structuredClone(state.geometry);},setParts(n){if(![8,16,32,64].includes(n))throw new Error('n必须为8、16、32或64');state.manualN=n;$('parts').value=String(n);render(state.time);},setFraction(a,b,c,d){if(![a,b,c,d].every(x=>Number.isInteger(x)&&x>0&&x<=12))throw new Error('分子分母必须为1到12的整数');state.fraction=[a,b,c,d];const key=state.fraction.join(',');const menu=$('fractionExample');if(![...menu.options].some(o=>o.value===key)){const o=document.createElement('option');o.value=key;o.textContent=`${frac(a,b)} ÷ ${frac(c,d)}`;menu.append(o);}menu.value=key;render(state.time);}};
render(0);
})();
</script>
</html>
