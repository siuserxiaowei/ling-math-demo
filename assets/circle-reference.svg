<path d="M 264 351 L 264 239" fill="none" stroke="#203635" stroke-width="3"/>
<text x="278" y="294" class="label">r</text>
<path d="M 465 337 L 575 337 M 557 323 L 575 337 L 557 351" fill="none" stroke="#203635" stroke-width="3"/>
<text x="94" y="515" class="small">总面积始终不变：πr²</text>
<text x="665" y="482" class="small">有限切分：近似长方形</text>
<text x="665" y="518" class="small">份数越多，弯边越接近直边</text>
<line x1="64" y1="566" x2="1136" y2="566" stroke="#cfd7c6"/>
<text x="64" y="617" class="label">③ 继续细分：8 → 16 → 32 → 64</text>
<text x="64" y="658" class="small">长越来越接近半个圆周 πr；宽越来越接近半径 r。</text>
<text x="64" y="701" class="label">所以，圆面积 = πr × r = πr²</text>
</svg>